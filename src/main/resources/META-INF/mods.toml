modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Butchery for Alex's Mobs: carcasses for the 82 creatures with something to butcher, hanging, bleeding, skinning, cuts, heads, trophies and rugs, using Butchery's own tools and stations. Jade shows the next step for these carcasses and Butchery's own. With Alex's Mobs Delight or Alex's Delight installed, carcasses yield that addon's meats.
'''

