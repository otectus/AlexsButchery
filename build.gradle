buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.client.mixins.json"
}

version = mod_version
group = mod_group
base { archivesName = mod_archive }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        // Everything the mob table generates (loot tables, recipes, tags, lang, models) lives here; run `runData`.
        resources { srcDir 'src/generated/resources' }
    }
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Test-only agent mod (alexsbutchery_smoketest): drives a dev client into a fresh flat world, stages carcasses
    // and takes framebuffer screenshots, then quits. Used by runClient -PsmokeTest. Never shipped.
    smokeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            // GameTests fail when this disagrees with the loaded mods, so the knife tests cannot silently skip.
            property 'alexsbutchery.gametest.farmersDelight', project.hasProperty('withFarmersDelight').toString()
            // Dependency mixins (Citadel, Alex's Mobs) ship SRG-named refmaps; remap them to the dev names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { alexsbutchery { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smokeTest')) {
                property 'alexsbutchery.smoketest.output', file('run/smoketest').absolutePath
                property 'alexsbutchery.smoketest.hangingReview', project.hasProperty('hangingReview').toString()
                property 'alexsbutchery.smoketest.geometryReview', (project.hasProperty('geometryReview') || project.hasProperty('geometryReload')).toString()
                property 'alexsbutchery.smoketest.geometryReload', project.hasProperty('geometryReload').toString()
                property 'alexsbutchery.smoketest.exportBounds', project.hasProperty('exportBounds').toString()
                // -PperfBench[=label]: frame-time and targeting benchmark, run/smoketest/perf-<label>.json (PerfBench).
                property 'alexsbutchery.smoketest.perfBench', project.hasProperty('perfBench').toString()
                property 'alexsbutchery.smoketest.perfLabel', project.findProperty('perfBench') ?: 'run'
                // -PsaveCompat=create (with an older build) / verify: old-save fixture, run/smoketest/save-compat*.json.
                property 'alexsbutchery.smoketest.saveCompat', project.findProperty('saveCompat') ?: ''
                // -PgroundReview=<label>: close-up ground-contact gallery, run/screenshots/ground_<label>_*.png.
                property 'alexsbutchery.smoketest.groundReview', project.findProperty('groundReview') ?: ''
                // -PremoteServer=host:port: interaction checks against a dedicated server, run/smoketest/remote-result.json.
                property 'alexsbutchery.smoketest.remoteServer', project.findProperty('remoteServer') ?: ''
                ['perfSeconds', 'perfWarmup', 'perfSamples'].each { name ->
                    if (project.hasProperty(name)) property "alexsbutchery.smoketest.${name}", project.property(name)
                }
                mods { alexsbutchery_smoketest { source sourceSets.smokeTest } }
            }
        }
        // A separate directory, so a dedicated server and a dev client (-PremoteServer) can run side by side.
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            mods { alexsbutchery { source sourceSets.gameTest } }
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Butchery's jar lives in libs/ (All Rights Reserved, never bundled); flatDir lets ForgeGradle deobf-remap it,
    // which fg.deobf cannot do for files(...) dependencies.
    flatDir { dirs 'libs' }
}

def butcheryJar = file("libs/${butchery_artifact}-${butchery_jar_version}.jar")

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Hard dependencies. Butchery is declared only when its jar is present so a fresh clone fails with the
    // explanatory compileJava guard below instead of Gradle's opaque resolution error.
    if (butcheryJar.exists()) {
        implementation fg.deobf("blank:${butchery_artifact}:${butchery_jar_version}")
    }
    implementation fg.deobf("maven.modrinth:alexs-mobs:${alexsmobs_modrinth_id}")
    implementation fg.deobf("maven.modrinth:citadel:${citadel_modrinth_id}")

    // Jade finds compat/jade by annotation; Patchouli reads the guide pages we ship under Butchery's book. Both are
    // optional at runtime and loaded in dev so the smoke test and GameTests exercise the integrations.
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_curse_file}")
    runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_curse_file}")
    runtimeOnly fg.deobf("maven.modrinth:patchouli:${patchouli_version}")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // -PwithFarmersDelight: Farmer's Delight in the dev runs, for the knife and cutting-board tests. Data-only in the mod.
    if (project.hasProperty('withFarmersDelight')) {
        runtimeOnly fg.deobf("maven.modrinth:farmers-delight:${farmersdelight_version}")
    }
}

tasks.named('compileJava').configure {
    doFirst {
        if (!butcheryJar.exists()) {
            throw new GradleException("Missing ${butcheryJar}: download Butchery (5.2 or later) for Forge 1.20.1 from CurseForge into libs/ (see README.md).")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                      mod_authors: mod_authors, minecraft_version_range: minecraft_version_range,
                      forge_version_range: forge_version_range, loader_version_range: loader_version_range,
                      butchery_version_range: butchery_version_range, alexsmobs_version_range: alexsmobs_version_range,
                      citadel_version_range: citadel_version_range]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('processSmokeTestResources', ProcessResources).configure {
    inputs.properties mod_version: mod_version, mod_license: mod_license
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version, mod_license: mod_license }
}

// Every GameTest run starts from a fresh world: saved item entities load after a test structure is cleared, so drops
// from an earlier run of the same layout would otherwise land in a test's counting area.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The smoke-test agent as a reobfuscated jar, for tools/packtest/ultima_pack_test.py against the Ultima modpack. Never shipped.
tasks.register('smokeTestJar', Jar) {
    archiveClassifier = 'smoketest'
    from sourceSets.smokeTest.output
    manifest.attributes('Implementation-Title': 'alexsbutchery_smoketest', 'Implementation-Version': mod_version)
}

reobf {
    // The agent calls inherited Minecraft methods on our types, so reobf must see the main classes.
    smokeTestJar { libraries.from(sourceSets.smokeTest.compileClasspath) }
}

tasks.named('smokeTestJar') { finalizedBy 'reobfSmokeTestJar' }

tasks.named('jar', Jar).configure {
    manifest.attributes('Specification-Title': mod_id, 'Specification-Vendor': mod_authors,
                        'Specification-Version': '1', 'Implementation-Title': project.name,
                        'Implementation-Version': mod_version, 'Implementation-Vendor': mod_authors,
                        'MixinConfigs': "${mod_id}.mixins.json,${mod_id}.client.mixins.json")
    finalizedBy 'reobfJar'
}
